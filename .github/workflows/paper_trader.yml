# RS Options — autonomous PAPER shadow track (§87).
# Runs after each market close: scans the universe through the adopted
# RS-02 doctrine, paper-trades surviving signals on Alpaca's paper
# account (hard-coded paper endpoint — no live path exists in the code),
# and commits the operator-facing report to rs_options/docs/reports/.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APCA_API_KEY_ID / APCA_API_SECRET_KEY  — Alpaca PAPER keys
name: RS Paper Trader

on:
  schedule:
    - cron: "35 21 * * 1-5"   # 21:35 UTC weekdays — after the NYSE close year-round
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-paper-trader
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas

      - name: Daily scan + paper trades + report
        working-directory: rs_options
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RS_PAPER_ARMED: "YES"
        run: python -m paper.daily

      - name: Commit report and ledger
        run: |
          git config user.name "rs-paper-bot"
          git config user.email "noreply@github.com"
          git pull --rebase origin main
          git add rs_options/docs/reports
          git diff --cached --quiet || git commit -m "paper trading report"
          git push
