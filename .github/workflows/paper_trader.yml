# RS Options — autonomous PAPER shadow track (§87).
# Runs after each market close: scans the universe through the adopted
# RS-02 doctrine, paper-trades surviving signals on Alpaca's paper
# account (hard-coded paper endpoint — no live path exists in the code),
# and commits the operator-facing report to rs_options/docs/reports/.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APCA_API_KEY_ID / APCA_API_SECRET_KEY  — Alpaca PAPER keys
#
# Optional, for the phone push (absent = the push step no-ops, nothing red):
#   TELEGRAM_BOT_TOKEN  — from @BotFather. If a token has ever been pasted
#                         anywhere but this secret, /revoke it and store the
#                         replacement: the token alone lets anyone send
#                         messages AS the bot, i.e. forge a trading digest.
#   TELEGRAM_CHAT_ID    — message the bot once, then read
#                         result[0].message.chat.id from
#                         api.telegram.org/bot<TOKEN>/getUpdates
name: RS Paper Trader

on:
  schedule:
    # 12:45 UTC weekdays — ~8:45am ET in summer, 7:45am in winter. The
    # pre-open briefing: read-only, places no orders.
    - cron: "45 12 * * 1-5"
    # 21:35 UTC weekdays — after the NYSE close year-round. The trading
    # run: scans, places orders, keeps the record.
    - cron: "35 21 * * 1-5"
    # 22:10 UTC weekdays — backup trading fire. GitHub drops or delays
    # scheduled fires under load (2026-08-26..28 the evening fire never
    # arrived on time); mode selection is wall-clock-based, and a
    # duplicate evening run is safe — entries are already-held-skipped,
    # the equity snapshot is date-deduped, and the concurrency group
    # serializes.
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run to perform"
        type: choice
        default: preopen
        options: [preopen, trade]

permissions:
  contents: write
  # The digest is posted as a comment on a single tracking issue, which is
  # the only delivery channel here that needs no operator-supplied
  # credential: it authenticates with the built-in GITHUB_TOKEN.
  issues: write

concurrency:
  group: rs-paper-trader
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Install the declared requirements rather than hand-picking
        # packages: an unattended job must not fail on a transitive
        # import (this is what broke the first run).
        run: pip install --quiet -r rs_options/mve/requirements.txt

      # Scheduled runs decide their mode by WALL CLOCK, not by which
      # cron GitHub claims fired: `github.event.schedule` proved
      # unreliable — on 2026-08-28 the 12:45 morning cron was delivered
      # at 22:41 UTC (and the evening fire never came), so the
      # cron-string branch ran a read-only briefing at night while no
      # trade run happened for three sessions. At or after 21:00 UTC —
      # past the NYSE close year-round (4pm ET in winter, 5pm in
      # summer) — a scheduled run trades; earlier it briefs, read-only.
      # A manual run keeps the explicit input, defaulting to the
      # briefing so an accidental click cannot place orders.
      # A delivery past midnight UTC is still the PREVIOUS session's
      # after-close run. Treating hour 00-04 as pre-open is what lost
      # 2026-09-21 and 2026-09-25 entirely: on 09-25 every fire landed
      # either before the close (17:32) or after midnight (00:05, 00:34),
      # so all three briefed read-only and that session was never scanned,
      # ordered, or exited. The 22:10 backup was neutered by this on
      # exactly the nights it existed to cover.
      #
      # So the window is 21:00-04:59 UTC (17:00-01:00 ET, after the close
      # and before the next session), and a run inside its post-midnight
      # half names yesterday as its session. `data_is_fresh` in paper.daily
      # still refuses to trade unless the benchmark's newest bar IS that
      # session, so a Monday 00:30 delivery resolves to Sunday, finds
      # Friday's bar, and correctly does nothing.
      - name: Select run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          SESSION=$(date -u +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "trade" ]; then FLAG=""; else FLAG="--preopen"; fi
          elif [ "$HOUR" -ge 21 ] || [ "$HOUR" -lt 5 ]; then
            FLAG=""
          else
            FLAG="--preopen"
          fi
          if [ -z "$FLAG" ] && [ "$HOUR" -lt 5 ]; then
            SESSION=$(date -u -d 'yesterday' +%F)
          fi
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "hour=$HOUR mode=${FLAG:-trade} session=$SESSION"

      - name: Scan + paper trades + report
        working-directory: rs_options
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RS_PAPER_ARMED: "YES"
        run: |
          python -m paper.daily ${{ steps.mode.outputs.flag }} \
            --session-date=${{ steps.mode.outputs.session }}

      # Gate on whether the DIGEST TEXT changed, which is the actual
      # question — "is there anything new to tell the operator?" — and
      # strictly better than the file tests that came before it. Gating on
      # the whole reports directory pushed a digest from a read-only
      # pre-open run (19:50, 2026-09-28); gating on paper_trading.txt fixed
      # that but still sent a BYTE-IDENTICAL second digest on three of the
      # four following sessions, because both evening fires rewrite the
      # report. Two pings a night, one a verbatim repeat, is how a
      # notification channel stops being read.
      #
      # Runs before the commit step so the marker it updates is committed
      # with the report, in one commit, rather than needing a second.
      - name: Build digest and decide whether it says anything new
        id: digest
        continue-on-error: true
        env:
          MARKER: rs_options/docs/reports/last_digest.txt
        run: |
          ( cd rs_options && python -m paper.notify ) > /tmp/digest.txt || true
          if [ ! -s /tmp/digest.txt ]; then
            echo "digest empty or build failed — not notifying"
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$MARKER" ] && cmp -s /tmp/digest.txt "$MARKER"; then
            echo "digest unchanged since the last one sent — not notifying"
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/digest.txt "$MARKER"
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit report, ledger and digest marker
        # The scan step above writes report/ledger files into the working
        # tree, so `git pull --rebase` must run AFTER they are committed —
        # rebase refuses to run over unstaged changes (this order caused
        # every scheduled run to fail from 2026-08-17 onward: the pull ran
        # first and always found the fresh report as an unstaged change).
        run: |
          git config user.name "rs-paper-bot"
          git config user.email "noreply@github.com"
          git add rs_options/docs/reports
          git diff --cached --quiet || git commit -m "paper trading report"
          git pull --rebase origin main
          git push

      # Each notification step is continue-on-error, because a
      # notification must never take the trading job down with it.

      - name: Post digest to the tracking issue
        # Needs no operator-supplied secret: GITHUB_TOKEN is built in, and
        # a comment on an issue the operator owns is what their GitHub
        # mobile app turns into a push notification. One issue, one
        # comment per session, so the thread reads chronologically.
        if: steps.digest.outputs.send == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "RS paper track — daily digest"
        run: |
          test -s /tmp/digest.txt || { echo "no digest to post"; exit 0; }
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/digest.txt
          else
            gh issue comment "$NUM" --body-file /tmp/digest.txt
          fi

      - name: Push digest to Telegram
        # Optional second channel. No-ops while the secrets are absent, so
        # the step is inert rather than red until they exist.
        if: steps.digest.outputs.send == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets absent — skipping push (not an error)."
            exit 0
          fi
          test -s /tmp/digest.txt || { echo "no digest to send"; exit 0; }
          curl -sS -o /dev/null -w 'telegram HTTP %{http_code}\n' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/digest.txt" \
            --data "disable_web_page_preview=true"
