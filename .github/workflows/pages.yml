name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'eatmedia/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically on first run so no manual Settings toggle is needed.
          enablement: true

      - name: Assemble site (assessment at root, book site at /book/, company site at /eatmedia/)
        run: |
          mkdir -p _site/book _site/eatmedia
          cp -r docs/. _site/
          cp -r site/. _site/book/
          cp -r eatmedia/. _site/eatmedia/
          # CNAME only applies at the artifact root; keep custom domains
          # out of play until DNS is set up (see site/README.md and
          # eatmedia/README.md).
          rm -f _site/book/CNAME
          rm -f _site/eatmedia/CNAME
          # The book site's 404 is self-contained and must live at the root
          # for GitHub Pages to serve it. The root has no other 404.
          cp site/404.html _site/404.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
