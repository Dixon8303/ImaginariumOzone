<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Complete — Black Genius Files Content Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Type system + palette shared with the rest of the Black Genius Files ecosystem (Dark Alchemy design language: obsidian / warm amber gold / cream). -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800&family=Lato:ital,wght@0,300;0,400;0,700;0,900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:oklch(0.10 0.008 285); --ink2:oklch(0.15 0.008 285); --ink3:oklch(0.185 0.01 285);
    --paper:oklch(0.92 0.02 80); --paper-dim:oklch(0.60 0.01 285);
    --brass:oklch(0.72 0.14 75); --brass-deep:oklch(0.55 0.11 75); --brass-light:oklch(0.80 0.12 75);
    --line:oklch(1 0 0 / 10%); --shadow-1:0 2px 6px rgba(0,0,0,.28); --bad:#8C3B2E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--paper);font-family:'Lato',sans-serif;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{position:relative;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 12% 8%, oklch(0.72 0.14 75 / 8%) 0%, transparent 60%),
      radial-gradient(ellipse 700px 900px at 92% 55%, oklch(0.72 0.14 75 / 5%) 0%, transparent 65%),
      radial-gradient(ellipse 1200px 500px at 50% 100%, oklch(0.10 0.008 285 / 60%) 0%, transparent 70%)}
  .wrap{max-width:640px;margin:0 auto;padding:64px 24px;position:relative;z-index:1}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:700}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:27px;margin:12px 0 20px;
     letter-spacing:-.01em;color:var(--paper)}
  .card{background:linear-gradient(165deg,var(--ink3),var(--ink2));border:1px solid var(--line);
        border-left:3px solid var(--brass);padding:22px;border-radius:7px;margin:20px 0;
        box-shadow:var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.03)}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-light);font-weight:700}
  #code{display:block;word-break:break-all;background:var(--ink);border:1px solid var(--line);
        color:var(--paper);padding:12px;border-radius:5px;margin-top:10px;
        font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  button{margin-top:16px;background:linear-gradient(180deg,var(--brass-light),var(--brass));
         color:#241C12;border:0;padding:11px 20px;border-radius:5px;font-family:'Lato',sans-serif;
         font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer;
         box-shadow:0 4px 14px oklch(0.72 0.14 75 / 30%);transition:box-shadow .2s}
  button:hover{box-shadow:0 6px 20px oklch(0.72 0.14 75 / 42%)}
  .err{border-left-color:var(--bad)} .err .label{color:var(--bad)}
  p{color:var(--paper);line-height:1.6} .muted{color:var(--paper-dim);font-size:14px}
  a{color:var(--brass);text-decoration:none}
  a:hover{color:var(--brass-light)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">E.A.T. Media &middot; Black Genius Files</div>
  <h1>Authorization callback</h1>
  <div id="out"></div>
  <p class="muted">This page is the OAuth 2.0 redirect target for the Black Genius Files
  Content Engine. It runs entirely in your browser, sends nothing anywhere, and stores
  nothing. <a href="./bgf-content-engine.html">About this tool</a></p>
</div>

<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("code");
  var state = q.get("state");
  var err = q.get("error");
  var desc = q.get("error_description");
  var out = document.getElementById("out");

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  if (err) {
    out.innerHTML =
      '<div class="card err"><div class="label">Authorization failed</div>' +
      '<p><strong>' + esc(err) + '</strong></p>' +
      (desc ? '<p class="muted">' + esc(desc) + '</p>' : '') +
      '<p class="muted">Re-run the authorization step and try again.</p></div>';
    return;
  }

  if (!code) {
    out.innerHTML =
      '<div class="card"><div class="label">Waiting</div>' +
      '<p>No authorization code present. Open this page by completing the Pinterest ' +
      'authorization flow — do not visit it directly.</p></div>';
    return;
  }

  out.innerHTML =
    '<div class="card"><div class="label">Authorization code</div>' +
    '<code id="code">' + esc(code) + '</code>' +
    '<button id="copy">Copy code</button>' +
    (state ? '<p class="muted" style="margin-top:14px">state: ' + esc(state) + '</p>' : '') +
    '<p class="muted">Paste this into the Content Engine to exchange it for an access ' +
    'token. It is single-use and expires quickly.</p></div>';

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(code).then(function () {
      btn.textContent = "Copied";
      setTimeout(function(){ btn.textContent = "Copy code"; }, 1800);
    });
  });
})();
</script>
</body>
</html>
