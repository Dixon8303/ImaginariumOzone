<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Complete — Black Genius Files Content Engine</title>
<style>
  :root{--ink:#141210;--paper:#faf7f2;--amber:#b8791f;--rule:#e2dace;--muted:#5b544c;--bad:#a3341f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Georgia,serif}
  .wrap{max-width:640px;margin:0 auto;padding:64px 24px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
  h1{font-size:26px;margin:10px 0 18px;letter-spacing:-.01em}
  .card{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--amber);
        padding:20px;border-radius:2px;margin:20px 0}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #code{display:block;word-break:break-all;background:#f0ebe2;border:1px solid var(--rule);
        padding:12px;border-radius:3px;margin-top:8px;
        font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  button{margin-top:14px;background:var(--amber);color:#fff;border:0;padding:10px 18px;
         border-radius:3px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{border-left-color:var(--bad)} .err .label{color:var(--bad)}
  p{color:#2c2721} .muted{color:var(--muted);font-size:14px}
  a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">E.A.T. Media &middot; Black Genius Files</div>
  <h1>Authorization callback</h1>
  <div id="out"></div>
  <p class="muted">This page is the OAuth 2.0 redirect target for the Black Genius Files
  Content Engine. It runs entirely in your browser, sends nothing anywhere, and stores
  nothing. <a href="./bgf-content-engine.html">About this tool</a></p>
</div>

<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("code");
  var state = q.get("state");
  var err = q.get("error");
  var desc = q.get("error_description");
  var out = document.getElementById("out");

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  if (err) {
    out.innerHTML =
      '<div class="card err"><div class="label">Authorization failed</div>' +
      '<p><strong>' + esc(err) + '</strong></p>' +
      (desc ? '<p class="muted">' + esc(desc) + '</p>' : '') +
      '<p class="muted">Re-run the authorization step and try again.</p></div>';
    return;
  }

  if (!code) {
    out.innerHTML =
      '<div class="card"><div class="label">Waiting</div>' +
      '<p>No authorization code present. Open this page by completing the Pinterest ' +
      'authorization flow — do not visit it directly.</p></div>';
    return;
  }

  out.innerHTML =
    '<div class="card"><div class="label">Authorization code</div>' +
    '<code id="code">' + esc(code) + '</code>' +
    '<button id="copy">Copy code</button>' +
    (state ? '<p class="muted" style="margin-top:14px">state: ' + esc(state) + '</p>' : '') +
    '<p class="muted">Paste this into the Content Engine to exchange it for an access ' +
    'token. It is single-use and expires quickly.</p></div>';

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(code).then(function () {
      btn.textContent = "Copied";
      setTimeout(function(){ btn.textContent = "Copy code"; }, 1800);
    });
  });
})();
</script>
</body>
</html>
