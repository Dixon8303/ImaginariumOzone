<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Genius Index — Find Your Braid</title>
<meta name="description" content="Everybody carries a genius. This locates yours. 81 items and nine short stations map your nine domains, then name the braid they make — free, anonymous, on your device.">
<meta property="og:title" content="The Genius Index — Find Your Braid">
<meta property="og:description" content="Everybody carries a genius. This locates yours. Nine domains, nine stations, thirty-six braids. Free and anonymous.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23231B15'/%3E%3Cg fill='none' stroke='%23C39A5B' stroke-width='2'%3E%3Crect x='6' y='6' width='10' height='10'/%3E%3Crect x='19' y='6' width='10' height='10'/%3E%3Crect x='32' y='6' width='10' height='10'/%3E%3Crect x='6' y='19' width='10' height='10'/%3E%3Crect x='19' y='19' width='10' height='10' fill='%23C39A5B'/%3E%3Crect x='32' y='19' width='10' height='10'/%3E%3Crect x='6' y='32' width='10' height='10'/%3E%3Crect x='19' y='32' width='10' height='10'/%3E%3Crect x='32' y='32' width='10' height='10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* — Material world (shared with the book + print system) — */
    --ink:#231B15; --ink2:#2E241B; --paper:#EDE4D4; --paper-dim:#B9AD98;
    --brass:#C39A5B; --brass-deep:#9A7440; --brass-light:#D3AC6C; /* the Glow */
    --oxblood:#8C3B2E; --moss:#5E7367; --slate:#7E93A8; --sage:#A9B4A6;
    --line:rgba(237,228,212,.14);
    /* Realm colours (Braid Constellations figure) — source of truth for SOMA/MIND/FIELD.
       Note: --mind (#54687C) is the FAMILY colour; --slate (#7E93A8) is the lighter
       band/tint tone. Keep them distinct. */
    --soma:#8C3B2E; --mind:#54687C; --field:#4E6156;
    --gold-ink:#7A5B31; --gold-chord:#6E6150;
    --book-paper:#EDE4D4; --book-ink:#2A2118; --book-dim:#6B6258; --book-line:rgba(42,33,24,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--ink); color:var(--paper); font-family:'Archivo',sans-serif; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:660px; padding:20px 18px 64px;}
  header{display:flex; justify-content:space-between; align-items:center; padding:14px 2px 10px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .eyebrow{font-size:11px; letter-spacing:.22em; color:var(--brass); font-weight:600; text-transform:uppercase;}
  .sub{font-size:10px; letter-spacing:.14em; color:var(--paper-dim); text-transform:uppercase; margin-top:3px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(30px,7vw,44px); line-height:1.06; letter-spacing:-0.01em;}
  h2{font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.15; margin-bottom:10px;}
  h3{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass); margin-bottom:8px; font-weight:600;}
  p{line-height:1.55; font-size:15px;}
  .dim{color:var(--paper-dim);}
  .small{font-size:12.5px; line-height:1.5;}
  /* Grid glyph */
  .glyph{display:grid; grid-template-columns:repeat(3,12px); grid-template-rows:repeat(3,12px); gap:3px;}
  .glyph div{background:transparent; border:1px solid var(--brass-deep); transition:background .5s ease;}
  .glyph div.lit{background:var(--brass);}
  .glyph.big{grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:8px; margin:18px auto;}
  .glyph.big div{border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; letter-spacing:.06em; transition:background .5s;}
  .glyph.big .code{font-weight:700; font-size:14px; font-family:'Fraunces',serif;}
  .glyph.big .pct{font-size:10px; color:var(--ink); opacity:.85;}
  /* Buttons */
  .btn{display:block; width:100%; padding:15px 16px; margin:8px 0; background:var(--ink2); border:1px solid var(--line); color:var(--paper); font-family:'Archivo',sans-serif; font-size:15px; text-align:left; cursor:pointer; transition:border-color .15s, background .15s;}
  /* Keyboard focus always highlights; hover only on real pointers so a tapped
     position doesn't stay "stuck" looking selected on the next question (touch fix). */
  .btn:focus-visible{border-color:var(--brass); outline:none;}
  @media (hover:hover){ .btn:hover{border-color:var(--brass); outline:none;} }
  .btn.sel{border-color:var(--brass); background:#3A2E20;}
  .btn.primary{background:var(--brass); color:var(--ink); font-weight:700; text-align:center; border:none; letter-spacing:.04em;}
  @media (hover:hover){ .btn.primary:hover{background:#D3AC6C;} }
  .btn.ghost{text-align:center; color:var(--paper-dim);}
  .btn:disabled{opacity:.35; cursor:default;}
  .btnrow{display:flex; gap:8px;} .btnrow .btn{margin:8px 0;}
  /* Progress */
  .prog{height:3px; background:var(--ink2); margin:0 0 20px; position:relative;}
  .prog i{position:absolute; left:0; top:0; bottom:0; background:var(--brass); transition:width .3s;}
  .stagecount{font-size:11px; letter-spacing:.16em; color:var(--paper-dim); text-transform:uppercase; margin-bottom:14px;}
  /* Cards & misc */
  .card{background:var(--ink2); border:1px solid var(--line); padding:18px; margin:14px 0;}
  .rule{border:none; border-top:1px solid var(--line); margin:18px 0;}
  .qtext{font-family:'Fraunces',serif; font-size:21px; line-height:1.32; font-weight:600; margin:6px 0 18px;}
  /* ── Callout card: the single reusable module component (colored left border).
     Set --accent + --accent-tint; every new results module is built on this. ── */
  .callout{--accent:var(--brass); --accent-tint:rgba(195,154,91,.12);
    border-left:3px solid var(--accent); padding:12px 14px; margin:12px 0;
    background:var(--accent-tint); font-size:13.5px; line-height:1.5; border-radius:0 4px 4px 0;}
  .callout .ct{display:block; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--accent); margin-bottom:3px; letter-spacing:.01em;}
  .callout--oxblood{--accent:var(--oxblood); --accent-tint:rgba(140,59,46,.12);}
  .callout--moss{--accent:var(--moss); --accent-tint:rgba(94,115,103,.12);}
  .callout--slate{--accent:var(--slate); --accent-tint:rgba(126,147,168,.14);}
  .callout--brass{--accent:var(--brass-deep); --accent-tint:rgba(195,154,91,.14);}
  /* Legacy aliases (existing markup) now share the component look */
  .flag{border-left:3px solid var(--oxblood); padding:10px 12px; background:rgba(140,59,46,.12); margin:10px 0; font-size:13.5px; line-height:1.5; border-radius:0 4px 4px 0;}
  .pass{border-left:3px solid var(--moss); padding:10px 12px; background:rgba(94,115,103,.12); margin:10px 0; font-size:13.5px; line-height:1.5; border-radius:0 4px 4px 0;}
  .timer{font-family:'Fraunces',serif; font-size:40px; font-weight:700; text-align:center; margin:10px 0; font-variant-numeric:tabular-nums;}
  textarea, input[type=text]{width:100%; background:var(--ink2); border:1px solid var(--line); color:var(--paper); padding:12px; font-family:'Archivo'; font-size:15px;}
  textarea:focus, input:focus{border-color:var(--brass); outline:none;}
  .padgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:280px; margin:16px auto;}
  .pad{aspect-ratio:1; font-size:30px; background:var(--ink2); border:1px solid var(--line); color:var(--paper); cursor:pointer;}
  .pad.flash{background:var(--brass); color:var(--ink);}
  .memgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
  .memgrid .btn{margin:0; text-align:center; padding:12px 6px; font-size:14px;}
  .bars{margin:16px 0;}
  .barrow{display:flex; align-items:center; gap:10px; margin:7px 0;}
  .barrow .lbl{width:96px; font-size:12px; letter-spacing:.04em;}
  .barrow .trk{flex:1; height:12px; background:var(--ink2); position:relative;}
  .barrow .trk i{position:absolute; left:0; top:0; bottom:0;}
  .barrow .val{width:34px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums;}
  .soma i{background:var(--brass);} .mind i{background:#A9B4A6;} .field i{background:#7E93A8;}
  .sig{font-family:'Fraunces',serif; font-size:clamp(34px,9vw,52px); font-weight:700; text-align:center; color:var(--brass); margin:10px 0 2px; letter-spacing:.02em;}
  .sigsub{text-align:center; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:14px;}
  .checkline{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
  .checkline input{width:20px; height:20px; accent-color:var(--brass);}
  table{width:100%; border-collapse:collapse; font-size:13px; margin:10px 0;}
  td,th{padding:7px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--brass); font-size:11px; letter-spacing:.12em; text-transform:uppercase;}
  .export{font-size:11px; height:120px; word-break:break-all;}
  /* ============ RESULTS · BOOK PAGES ============ */
  .book{background:var(--book-paper); color:var(--book-ink); margin:22px -18px 0; padding:26px 20px 30px; border-top:2px solid var(--brass);}
  .book + .book{margin-top:0; border-top:1px solid var(--book-line);}
  .book .eyebrow-b{font-family:'Archivo',sans-serif; font-size:10.5px; letter-spacing:.28em; font-weight:700; text-transform:uppercase; color:var(--gold-ink); text-align:center;}
  .book h2.bt{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(24px,6vw,32px); line-height:1.08; text-align:center; color:var(--book-ink); margin:4px 0 6px; letter-spacing:-.01em;}
  .book .btsub{font-family:'Literata',Georgia,serif; font-style:italic; font-size:14px; line-height:1.4; text-align:center; color:var(--book-dim); max-width:44ch; margin:0 auto 4px;}
  .book .brule{width:56px; height:2px; background:var(--brass); border:none; margin:12px auto 20px;}
  .book .bfoot{font-family:'Literata',Georgia,serif; font-style:italic; font-size:12.5px; line-height:1.5; color:var(--book-dim); border-top:1px solid var(--book-line); margin-top:22px; padding-top:14px;}
  /* Braid hero card */
  /* Hero: the cover object, elevated. Radial paper-glow behind the lit-grid motif. */
  .book--hero{position:relative; overflow:hidden;}
  .book--hero::before{content:""; position:absolute; top:-10%; left:50%; transform:translateX(-50%);
    width:340px; height:340px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(195,154,91,.20) 0%, rgba(195,154,91,.06) 42%, transparent 70%);}
  .braidcard{text-align:center; padding:8px 0 4px; position:relative;}
  .braidcard .yb{font-family:'Archivo',sans-serif; font-size:11px; letter-spacing:.3em; font-weight:700; text-transform:uppercase; color:var(--gold-ink);}
  .heroglyph{width:150px; margin:16px auto 6px;}
  .heroglyph svg{display:block; width:100%; height:auto; overflow:visible;
    filter:drop-shadow(0 6px 18px rgba(154,116,64,.28));}
  .braidcard .bname{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(40px,12vw,64px); line-height:1.0; color:var(--book-ink); margin:8px 0 12px; letter-spacing:-.005em;}
  .braidcard .bpair{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; margin:12px 0;}
  .domchip{display:inline-flex; align-items:center; gap:7px; padding:7px 14px 7px 11px; border-radius:20px; font-family:'Fraunces',serif; font-weight:600; font-size:15px; background:rgba(0,0,0,.03);}
  .domchip .dot{width:11px; height:11px; border-radius:50%;}
  .domchip.soma{color:var(--soma); box-shadow:inset 0 0 0 1.5px rgba(140,59,46,.45);} .domchip.soma .dot{background:var(--soma);}
  .domchip.mind{color:var(--mind); box-shadow:inset 0 0 0 1.5px rgba(84,104,124,.45);} .domchip.mind .dot{background:var(--mind);}
  .domchip.field{color:var(--field); box-shadow:inset 0 0 0 1.5px rgba(78,97,86,.45);} .domchip.field .dot{background:var(--field);}
  .bpair .amp{font-family:'Fraunces',serif; font-size:19px; color:var(--book-dim);}
  .tierbadge{display:inline-block; margin:8px auto 2px; padding:6px 16px; border-radius:4px; font-family:'Archivo',sans-serif; font-size:11px; letter-spacing:.18em; font-weight:700; text-transform:uppercase;}
  .tier-C{background:var(--brass); color:#2A2118;}
  .tier-S{background:rgba(78,97,86,.16); color:var(--field); box-shadow:inset 0 0 0 1.5px rgba(78,97,86,.5);}
  .tier-R{background:rgba(140,59,46,.13); color:var(--soma); box-shadow:inset 0 0 0 1.5px rgba(140,59,46,.5);}
  .tier-Q{background:rgba(84,104,124,.13); color:var(--mind); box-shadow:inset 0 0 0 1.5px rgba(84,104,124,.5);}
  .tiersub{font-family:'Literata',Georgia,serif; font-style:italic; font-size:13.5px; color:var(--book-dim); margin:8px auto 0; max-width:42ch;}
  .braiddesc{font-family:'Fraunces',serif; font-size:18px; line-height:1.4; color:var(--book-ink); margin:14px auto 0; max-width:40ch;}
  /* Constellation wheel */
  .wheelwrap{margin:6px auto 0; max-width:520px; position:relative;}
  .wheelwrap svg{display:block; width:100%; height:auto; overflow:visible;}
  .wnode{cursor:pointer;} .wnode:focus{outline:none;}
  .wnode:focus .wdot, .wnode:hover .wdot{stroke-width:3.5; filter:drop-shadow(0 0 4px rgba(195,154,91,.6));}
  .wtip{position:absolute; z-index:5; pointer-events:none; background:#2A2118; color:#EDE4D4; font-family:'Archivo',sans-serif;
    font-size:12.5px; line-height:1.4; padding:7px 11px; border-radius:5px; max-width:220px; box-shadow:0 6px 18px rgba(0,0,0,.28);
    transform:translate(-50%,-115%); white-space:normal;}
  .wtip strong{color:var(--brass-light);}
  .wlegend{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; margin:14px 0 2px; font-family:'Archivo',sans-serif; font-size:11px; color:var(--book-dim);}
  .wl-item{display:inline-flex; align-items:center; gap:5px;}
  .wl-swatch{width:12px; height:12px; border-radius:3px; display:inline-block; flex:0 0 auto;}
  .wl-gold-strong{background:#B4832E;} .wl-gold-soft{background:#9A7440; opacity:.6;} .wl-faint{background:#8C7E69; opacity:.35;}
  /* Index grid */
  .gridscroll{overflow-x:auto; margin:6px -20px 0; padding:0 20px 6px;}
  /* Mobile fallback: below 640px the 9x9 grid is unreadable even with scroll —
     show the accordion instead. Above it, show the table and hide the accordion. */
  .grid-mobile{display:none;}
  @media (max-width:640px){ .grid-desktop{display:none;} .grid-mobile{display:block;} }
  .gaItem{border:1px solid var(--book-line); border-radius:6px; margin:6px 0; background:rgba(0,0,0,.015); overflow:hidden;}
  .gaItem summary{display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--book-ink); list-style:none;}
  .gaItem summary::-webkit-details-marker{display:none;}
  .gaSum{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:5px; color:#EDE4D4; font-family:'Archivo',sans-serif; font-weight:700; font-size:11px; flex:0 0 auto;}
  .gaScore{margin-left:auto; font-family:'Archivo',sans-serif; font-size:13px; color:var(--gold-ink); font-weight:700;}
  .gaBody{padding:0 12px 10px 50px;}
  .gaRow{display:flex; align-items:baseline; gap:8px; padding:5px 0; border-bottom:1px solid var(--book-line); font-size:12.5px;}
  .gaRow:last-child{border-bottom:none;}
  .gaDot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .gaOther{color:var(--book-dim); min-width:78px;}
  .gaBraid{font-family:'Fraunces',serif; font-weight:600; color:var(--book-ink);}
  .gaRow.mine{background:rgba(195,154,91,.22);} .gaRow.adj{background:rgba(195,154,91,.08);}
  .igrid{border-collapse:separate; border-spacing:3px; margin:0 auto; min-width:min-content;}
  .igrid td{padding:0; border:none;}
  .gcell{width:62px; height:40px; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; line-height:1.05;}
  .gcell .gn{font-family:'Archivo',sans-serif; font-size:8.5px; font-weight:600; letter-spacing:.01em;}
  .gcell .gs{font-family:'Fraunces',serif; font-size:12px; font-weight:700;}
  .gcell .gt{font-size:7px; letter-spacing:.05em;}
  .gcell.mine{outline:2.5px solid var(--brass); outline-offset:1px; box-shadow:0 0 0 3px rgba(195,154,91,.28);}
  .gcell.adj{outline:1.5px solid rgba(195,154,91,.6);}
  /* Field guide */
  .fgcols{columns:2; column-gap:26px; margin-top:4px;}
  @media (max-width:520px){ .fgcols{columns:1;} }
  .fgrow{break-inside:avoid; display:flex; align-items:baseline; gap:8px; padding:7px 8px; border-bottom:1px solid var(--book-line); border-radius:3px;}
  .fgrow .fgdot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; margin-top:5px; background:transparent; box-shadow:inset 0 0 0 1px var(--book-dim);}
  .fgrow.canon .fgdot{background:var(--brass); box-shadow:none;}
  .fgrow .fgn{font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--book-ink);}
  .fgrow .fgp{font-family:'Archivo',sans-serif; font-size:9.5px; letter-spacing:.04em; color:var(--book-dim); font-weight:600;}
  .fgrow .fgd{font-family:'Literata',Georgia,serif; font-size:11.5px; color:var(--book-dim); line-height:1.35; display:block; width:100%;}
  .fgrow.mine{background:rgba(195,154,91,.22); box-shadow:inset 0 0 0 1.5px var(--brass);}
  .fgrow.adj{background:rgba(195,154,91,.08);}
  .fgtxt{flex:1;}
  /* Result action buttons */
  .book .btn.book-primary{background:var(--brass); color:#2A2118; border:none; font-weight:700; text-align:center; letter-spacing:.03em;}
  .book .btn.book-ghost{background:transparent; color:var(--gold-ink); border:1px solid rgba(122,91,49,.4); text-align:center;}
  .submitstatus{font-family:'Archivo',sans-serif; font-size:12.5px; text-align:center; margin:12px 0 0; color:var(--book-dim);}
  .submitstatus.ok{color:var(--field);} .submitstatus.err{color:var(--soma);}
  .book details{margin-top:16px;} .book details summary{cursor:pointer; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--book-dim); font-weight:600;}
  details.abc{background:#F5EFE2; border:1px solid var(--book-line); border-radius:4px; padding:10px 14px; margin:14px 0;}
  details.abc summary{color:var(--gold-ink); font-family:'Archivo',sans-serif;}
  details.abc[open] summary{margin-bottom:6px;}
  .abclist{list-style:none; margin:6px 0; padding:0;}
  .abclist li{font-size:13px; line-height:1.5; color:var(--book-ink); padding:6px 0 6px 14px; border-left:2px solid var(--brass); margin:6px 0; background:rgba(195,154,91,.06);}
  /* ── R3 content modules (all inside .callout cards) ── */
  .callout p{font-size:13.5px; line-height:1.5; color:var(--book-ink);}
  .modfoot{font-family:'Literata',Georgia,serif; font-style:italic; font-size:12.5px; color:var(--book-dim); margin-top:10px !important; border-top:1px solid var(--book-line); padding-top:8px;}
  .dot.soma{background:var(--soma);} .dot.mind{background:var(--mind);} .dot.field{background:var(--field);}
  details.ev{margin:0 0 12px;} details.ev summary{list-style:none;} details.ev summary::-webkit-details-marker{display:none;}
  details.ev summary .ct{cursor:pointer;} details.ev summary .ct::after{content:" ▸"; font-size:11px;} details.ev[open] summary .ct::after{content:" ▾";}
  .evrow{padding:8px 0; border-bottom:1px solid var(--book-line);} .evrow:last-of-type{border-bottom:none;}
  .evrow .evh{display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--book-ink); margin-bottom:3px;}
  .evrow .evh .dot{width:9px; height:9px; border-radius:50%;}
  .evrow p{font-size:12.5px; line-height:1.5; color:var(--book-dim);}
  .evfoot{font-family:'Literata',Georgia,serif; font-style:italic; font-size:12px; color:var(--book-dim); margin-top:8px;}
  table.hobt, table.chalt{width:100%; border-collapse:collapse; margin:4px 0 2px; font-size:12px;}
  table.hobt th, table.chalt th{color:var(--gold-ink); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; text-align:left; padding:4px 6px; border-bottom:1px solid var(--book-line); vertical-align:bottom;}
  table.hobt td, table.chalt td{padding:7px 6px; border-bottom:1px solid var(--book-line); color:var(--book-ink); vertical-align:top; line-height:1.4;}

let sampleTimer=null, sampleIdx=0;
function showSample(i){
 const wrap=$("sampleCarousel"); if(!wrap) return;
 const slides=wrap.querySelectorAll(".sampleslide"); if(!slides.length) return;
 sampleIdx = ((i%slides.length)+slides.length)%slides.length;
 slides.forEach((s,idx)=>s.classList.toggle("on", idx===sampleIdx));
 document.querySelectorAll(".sampledot").forEach((d,idx)=>d.classList.toggle("on", idx===sampleIdx));
}
function armSampleAutoAdvance(){
 if(sampleTimer) clearInterval(sampleTimer);
 if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; // dots still work, no autoplay
 sampleTimer=setInterval(()=>{
  const wrap=$("sampleCarousel");
  if(!wrap){ clearInterval(sampleTimer); sampleTimer=null; return; } // intro() left the screen -- stop ticking
  showSample(sampleIdx+1);
 }, 4500);
}
function disarmSampleAutoAdvance(){ if(sampleTimer){ clearInterval(sampleTimer); sampleTimer=null; } }
function startSampleCarousel(){
 sampleIdx=0;
 const wrap=$("sampleCarousel"); if(!wrap) return;
 armSampleAutoAdvance();
 wrap.addEventListener("pointerenter", disarmSampleAutoAdvance);
 wrap.addEventListener("pointerleave", armSampleAutoAdvance);
}

function part1(){ S.flowIdx=0; busy=true; pingStart(); renderQ(); }
/* Anonymous funnel ping — a start is recorded distinct from a completed
   submission, so drop-off can be measured. Fire-and-forget; never blocks. */
function pingStart(){
 if(!SUBMIT_URL) return;
 try{
  fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({v:"GI-1.0", event:"start", ts:new Date().toISOString(), code:S.code||null})}).catch(()=>{});
 }catch(e){}
}
function renderQ(){
 if(S.flowIdx>=FLOW.length){ stationIntro(); return; }
 const f=FLOW[S.flowIdx];
 setProg(S.flowIdx/FLOW.length*0.55);
 const domDone = Math.floor(S.flowIdx/FLOW.length*9); litCells(Math.min(domDone, 4));
 let text, scale;
 if(f.t==="A"){ text=A[f.d][f.i]; scale=FREQ; }
 else if(f.t==="C"){ text=C[f.d][f.i]; scale=AGREE; }
 else { text=SDR[f.i]; scale=AGREE; }
 const cur = f.t==="A"?S.respA[f.d][f.i] : f.t==="C"?S.respC[f.d][f.i] : S.respSDR[f.i];
 h(`
  <div class="stagecount">Part 1 · Item ${S.flowIdx+1} of ${FLOW.length}</div>
  <div class="qtext">${esc(text)}</div>
  ${scale.map((s,v)=>`<button class="btn ${cur===v?'sel':''}" onclick="answer(${v})">${s}</button>`).join("")}
  <div class="btnrow">
   <button class="btn ghost" id="navBack" ${S.flowIdx===0?"disabled":""} onclick="goBack()">← Back</button>
   <button class="btn ghost" id="navNext" ${cur==null?"disabled":""} onclick="goNext()">Next →</button>
  </div>
 `);
}
function curAnswer(){ const f=FLOW[S.flowIdx];
 return f.t==="A"?S.respA[f.d][f.i] : f.t==="C"?S.respC[f.d][f.i] : S.respSDR[f.i]; }
function goBack(){ if(S.flowIdx>0){ S.flowIdx--; renderQ(); } }
function goNext(){ if(curAnswer()!=null && S.flowIdx<FLOW.length){ S.flowIdx++; renderQ(); } }
function answer(v){
 const f=FLOW[S.flowIdx];
 if(f.t==="A") S.respA[f.d][f.i]=v;
 else if(f.t==="C") S.respC[f.d][f.i]=v;

}

/* --- SEN: pitch match (Web Audio) --- */
function stSEN(){
 let trial=0, correct=0, ctx=null;
 function tone(f,when,dur){ const o=ctx.createOscillator(), g=ctx.createGain();
  o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.25,when+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur); o.start(when); o.stop(when+dur+0.05); }
 function render(){
  if(trial>=PITCH_TRIALS.length){ completeStation("SEN", correct/5, correct+"/5"); return; }
  h(`
   <div class="stagecount">Station 2 of 9 · Sensory</div>
   <h2>Pitch match · trial ${trial+1} of 5</h2>
   <p class="dim small">Two tones will play. Use earphones or a quiet room. Was the second tone higher, lower, or the same?</p>
   <button class="btn primary" id="playT">Play tones</button>
   <div class="btnrow">
    <button class="btn" id="hi" disabled>Higher</button>
    <button class="btn" id="same" disabled>Same</button>
    <button class="btn" id="lo" disabled>Lower</button>
   </div>
   <p class="small dim" id="senMsg"></p>
   <button class="btn ghost" id="senSkip">No sound on this device — skip station</button>
  `);
  $("senSkip").onclick=()=>skipStation("SEN");
  $("playT").onclick=()=>{
   try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume && ctx.resume();
    const t=PITCH_TRIALS[trial], f2=t.base*Math.pow(2,t.cents/1200), now=ctx.currentTime+0.05;
    tone(t.base,now,0.7); tone(f2,now+1.0,0.7);
    ["hi","same","lo"].forEach(id=>$(id).disabled=false);
   }catch(err){ $("senMsg").textContent="Audio isn't available in this browser — use “skip station” below."; }
  };
  const key = PITCH_TRIALS[trial].cents>0?"hi":PITCH_TRIALS[trial].cents<0?"lo":"same";
  ["hi","same","lo"].forEach(id=>{ $(id).onclick=()=>{ if(id===key) correct++; trial++; render(); }; });
 }
 render();
}

/* --- ADP: hypermobility + breath --- */
function stADP(){
 const checks=["Left little finger bends back past 90\u00b0","Right little finger bends back past 90\u00b0","Left thumb touches forearm","Right thumb touches forearm","Left elbow extends beyond straight","Right elbow extends beyond straight","Left knee extends beyond straight","Right knee extends beyond straight","Palms flat on floor, knees straight"];
 let hold=0, holding=false, hi=null;
 h(`
  <div class="stagecount">Station 9a · Adaptive</div>
  <h2>Body screen</h2>
  <p class="dim small">Check what's true for you (gently — never force a joint):</p>
  <div id="bx">${checks.map((c,i)=>`<label class="checkline"><input type="checkbox" data-i="${i}"> ${c}</label>`).join("")}</div>
  <h3 style="margin-top:16px">Breath-hold</h3>
  <p class="small dim">Seated. Normal breath in, hold, stop at the first strong urge. \u26a0 Never in water, never standing, never past discomfort.</p>
  <div class="timer" id="bhT">0.0</div>
  <button class="btn" id="bhBtn">Start hold</button>
  <button class="btn primary" id="adpDone">Finish station</button>
 `);
 $("bhBtn").onclick=function(){
  if(!holding){ holding=true; this.textContent="Stop — I breathed"; const t0=Date.now();
   hi=setInterval(()=>{ hold=(Date.now()-t0)/1000; $("bhT").textContent=hold.toFixed(1); },100);
  } else { holding=false; clearInterval(hi); this.disabled=true; }
 };
 $("adpDone").onclick=()=>{
  if(holding){ clearInterval(hi); }
  const b=[...document.querySelectorAll("#bx input")].filter(x=>x.checked).length;
  const norm=0.6*(b/9)+0.4*(Math.min(hold,90)/90);
  completeStation("ADP", norm, `Beighton ${b}/9 · hold ${hold.toFixed(0)}s`);
 };
}

/* --- PER: orientation + time sense --- */
function stPER(){
 let north=null, exit=null, est=null, t0=null;
 function score(){
  if(north===null||exit===null||est===null) return;
  const err=Math.abs(est-30), pts=(err<=2?2:err<=5?1:0)+north+exit;
  completeStation("PER", pts/4, `north ${north} · exit ${exit} · est ${est.toFixed(1)}s`);
 }
 h(`
  <div class="stagecount">Station 9b · Perceptive</div>
  <h2>Orientation & time</h2>
  <h3>1 · Point north</h3>
  <p class="small dim">Physically point where you believe north is. Then check a compass app.</p>
  <div class="btnrow">
   <button class="btn" onclick="window._pn(1,this)">I was right (\u00b145\u00b0)</button>
   <button class="btn" onclick="window._pn(0,this)">Off / unsure</button>
  </div>
  <h3 style="margin-top:14px">2 · The last building</h3>
  <p class="small dim">Picture the last building you were in, other than home. From where you sat or stood — where was the nearest exit? Verify from memory or a map.</p>
  <div class="btnrow">
   <button class="btn" onclick="window._px(1,this)">Placed it correctly</button>
   <button class="btn" onclick="window._px(0,this)">Couldn't place it</button>
  </div>
  <h3 style="margin-top:14px">3 · Thirty seconds, no counting</h3>
  <p class="small dim">Press start, look away from the screen, press stop when you feel 30 seconds have passed. Don't count.</p>
  <button class="btn" id="perT">Start</button>
  <p class="small dim" id="perMsg"></p>
 `);
 window._pn=(v,el)=>{ north=v; [...el.parentElement.children].forEach(b=>b.classList.remove("sel")); el.classList.add("sel"); score(); };
 window._px=(v,el)=>{ exit=v; [...el.parentElement.children].forEach(b=>b.classList.remove("sel")); el.classList.add("sel"); score(); };
 $("perT").onclick=function(){
  if(t0===null){ t0=Date.now(); this.textContent="Stop at 30"; }
  else { est=(Date.now()-t0)/1000; this.disabled=true;
   $("perMsg").textContent=`You stopped at ${est.toFixed(1)}s.`; score(); }
 };
}

/* ============ RANKING ============ */
function ranking(){
 setProg(0.93); litCells(9);
 const desc={KIN:"Body & movement",SEN:"Senses & perception",ADP:"Physical adaptation",ANL:"Analysis & systems",MEM:"Memory",GEN:"Idea generation",REL:"Reading people",EXP:"Expression & performance",PER:"Environmental awareness"};
 let phase="top";
 function render(){
  const pool=DOMAINS.filter(d=>!S.ranksTop.includes(d.id)&&!S.ranksBot.includes(d.id));
  h(`
   <div class="stagecount">Part 3 · Forced ranking</div>
   <h2>${phase==="top"?"Pick your TOP 3":"Now your BOTTOM 3"}</h2>
   <p class="dim small">${phase==="top"?"The three that describe you most.":"The three that describe you least."} You can't rate everything high — that's the point.</p>
   ${pool.map(d=>`<button class="btn" onclick="window._rk('${d.id}')">${d.name} — ${desc[d.id]}</button>`).join("")}
   <p class="small dim">${phase==="top"?S.ranksTop.length:S.ranksBot.length} of 3 selected</p>

const domById = id => DOMAINS.find(d=>d.id===id);
const DOMAIN_DEF = {
 KIN:"Learns and reproduces physical movement fast.", SEN:"Notices fine sensory detail others miss.",
 ADP:"Body tolerates and recovers from extremes.", ANL:"Finds the pattern, the error, the system.",

/* Personal constellation wheel (SVG). R = scores map, primaryKey + adjKeys highlight braids. */
function buildWheel(R, primaryKey, adjKeys, primaryBraid){
 const cx=312, cy=340, Rr=185;
 const order=["EXP","PER","KIN","SEN","ADP","ANL","MEM","GEN","REL"];
 const ang={}; order.forEach((id,i)=> ang[id]=-90+i*40);
 const pos={}; order.forEach(id=>{ const a=ang[id]*Math.PI/180; pos[id]=[cx+Rr*Math.cos(a), cy+Rr*Math.sin(a)]; });
 const polar=(r,deg)=>{ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
 const arc=(r,a0,a1)=>{ const [x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
 let svg=`<svg viewBox="0 0 624 640" role="img" aria-label="Your genius constellation">`;
 svg+=`<path d="${arc(Rr+40,-30,90)}" fill="none" stroke="#8C3B2E" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 svg+=`<path d="${arc(Rr+40,90,210)}" fill="none" stroke="#54687C" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 svg+=`<path d="${arc(Rr+40,210,330)}" fill="none" stroke="#4E6156" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 const lbl=(txt,deg,col)=>{ const [x,y]=polar(Rr+62,deg); return `<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="${col}">${txt}</text>`; };
 svg+=lbl("SOMA",30,"#8C3B2E")+lbl("MIND",150,"#54687C")+lbl("FIELD",270,"#4E6156");
 const chord=(k,br)=>{ const [a,b]=k.split("|"); const [x0,y0]=pos[a],[x1,y1]=pos[b];
  let stroke="#8C7E69",w=1,op=.22;
  if(br.tier==="C"){ stroke="#6E6150"; w=1.5; op=.42; }
  if(adjKeys.has(k)){ stroke="#9A7440"; w=2.4; op=.72; }
  const isPrimary=(k===primaryKey);
  if(isPrimary){ stroke="#B4832E"; w=4.5; op=.98; }
  // The one orchestrated moment: the primary braid thread draws itself in on load.
  const extra = isPrimary ? ` class="braid-draw" pathLength="1"` : "";
  return {svg:`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${stroke}" stroke-width="${w}" stroke-opacity="${op}" stroke-linecap="round"${extra}/>`, top:(k===primaryKey||adjKeys.has(k))}; };
 const cs=BRAIDS.map(br=>chord(braidKey(br.pair[0],br.pair[1]),br));
 svg+=cs.filter(c=>!c.top).map(c=>c.svg).join("")+cs.filter(c=>c.top).map(c=>c.svg).join("");
 if(primaryBraid){ const [a,b]=primaryKey.split("|"); const mx=(pos[a][0]+pos[b][0])/2, my=(pos[a][1]+pos[b][1])/2;
  const w=primaryBraid.name.length*7.2+16;
  svg+=`<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)})"><rect x="${(-w/2).toFixed(1)}" y="-11" width="${w.toFixed(1)}" height="22" rx="5" fill="#EFE7D6" stroke="#B4832E" stroke-width="1.3"/><text x="0" y="4.5" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="12.5" fill="#7A5B31">${primaryBraid.name}</text></g>`; }
 order.forEach(id=>{ const d=domById(id), [x,y]=pos[id], sc=R[id].score;
  const col=realmHex(d.meta), r=22+sc/100*7, op=(0.12+0.5*sc/100).toFixed(2);
  const isTop=(id===primaryKey.split("|")[0]||id===primaryKey.split("|")[1]);
  const tipName=esc(d.name), tipBody=esc(`${sc} · ${DOMAIN_DEF[id]}`);
  svg+=`<g class="wnode" tabindex="0" role="button" aria-label="${tipName} — ${tipBody}" data-name="${tipName}" data-body="${tipBody}">`;
  svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r+8).toFixed(1)}" fill="transparent"/>`; // larger invisible hit target
  svg+=`<circle class="wdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="${isTop?3:1.5}"/>`;
  svg+=`<text x="${x.toFixed(1)}" y="${(y+1).toFixed(1)}" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="13" fill="${col}" style="pointer-events:none">${d.code}</text>`;
  svg+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-size="9" font-weight="700" fill="${col}" style="pointer-events:none">${sc}</text>`;
  svg+=`</g>`;
 });
 svg+=`</svg>`;
 return svg;
}

/* Triangular Complete Index Grid, personalized. */
function buildGrid(R, primaryKey, adjKeys){
 let rows="";
 for(let r=0;r<9;r++){
  let cells="";
  for(let c=0;c<=r;c++){
   if(c===r){ const d=DOMAINS[r];
    cells+=`<td><div class="gcell" style="background:${realmColor(d.meta)};color:#EDE4D4"><span class="gn" style="opacity:.85">${d.code}</span><span class="gs">${R[d.id].score}</span></div></td>`;
   } else { const br=braidFor(DOMAINS[r].id,DOMAINS[c].id), k=braidKey(DOMAINS[r].id,DOMAINS[c].id);
    const canon=br.tier==="C"; const mine=k===primaryKey, adj=adjKeys.has(k);
    const bg = mine?"rgba(195,154,91,.35)": canon?"rgba(195,154,91,.16)":"rgba(0,0,0,.03)";
    const dotc = br.tier==="C"?"#B4832E":br.tier==="S"?"#4E6156":br.tier==="R"?"#8C3B2E":"#54687C";
    cells+=`<td><div class="gcell ${mine?'mine':adj?'adj':''}" style="background:${bg}"><span class="gn" style="color:var(--book-ink)">${br.name.replace(/^The /,"")}</span><span class="gt" style="color:${dotc}">●</span></div></td>`;
   }
  }
  rows+=`<tr>${cells}</tr>`;
 }
 const desktop = `<div class="gridscroll grid-desktop"><table class="igrid">${rows}</table></div>`;
 return desktop + buildGridAccordion(R, primaryKey, adjKeys);
}

/* Mobile fallback: a 9×9 triangular table doesn't work at phone width — an
   accordion, one entry per domain, listing the braid it forms with every
   other domain. Same data as the desktop grid, browsable without pinch-zoom. */
function buildGridAccordion(R, primaryKey, adjKeys){
 const rows = DOMAINS.map(d=>{
  const others = DOMAINS.filter(o=>o.id!==d.id).map(o=>{
   const br=braidFor(d.id,o.id), k=braidKey(d.id,o.id);
   const mine=k===primaryKey, adj=adjKeys.has(k);
   const dotc = br.tier==="C"?"#B4832E":br.tier==="S"?"#4E6156":br.tier==="R"?"#8C3B2E":"#54687C";
   return `<div class="gaRow ${mine?'mine':adj?'adj':''}"><span class="gaDot" style="background:${dotc}"></span><span class="gaOther">${o.name}</span><span class="gaBraid">${br.name}</span></div>`;
  }).join("");
  return `<details class="gaItem"><summary><span class="gaSum" style="background:${realmColor(d.meta)}">${d.code}</span>${d.name}<span class="gaScore">${R[d.id].score}</span></summary><div class="gaBody">${others}</div></details>`;
 }).join("");
 return `<div class="grid-mobile">${rows}</div>`;
}

/* Field guide: all 36, grouped by tier, personalized. */
function buildFieldGuide(R, primaryKey, adjKeys){
 const groups=[["C","The Canonical Ten"],["S","The Strong Pairs"],["R","The Rarest"],["Q","The Quiet Few"]];
 let out="";
 groups.forEach(([t,title])=>{
  const items=BRAIDS.filter(b=>b.tier===t);
  out+=`<div class="eyebrow-b" style="text-align:left;margin:14px 0 4px">${title}</div><div class="fgcols">`;
  items.forEach(br=>{ const k=braidKey(br.pair[0],br.pair[1]);
   const mine=k===primaryKey, adj=adjKeys.has(k);
   const ps=(R[br.pair[0]].score+R[br.pair[1]].score)/2;
   const op=mine?1:(0.5+0.5*ps/100).toFixed(2);
   const codes=br.pair.map(id=>domById(id).code).join("·");
   out+=`<div class="fgrow ${t==="C"?'canon':''} ${mine?'mine':adj?'adj':''}" style="opacity:${op}">
     <span class="fgdot"></span><div class="fgtxt"><span class="fgn">${br.name}</span> <span class="fgp">${codes}</span><span class="fgd">${br.desc}${br.rare?" · also among the rarest":""}</span></div></div>`;
  });
  out+=`</div>`;
 });
 return out;
}

}

/* ============ INTERPRETATION COMPUTE LAYER ============ */
/* Domain -> book chapter (Ch 7 Kinetic … Ch 15 Perceptive; 17–18 = stacking + protocol) */
const chapterOf = id => 7 + DOMAINS.findIndex(d=>d.id===id);
const CH_STACK = 18; // the amplification/protocol chapter
const BAND_RANK = {Signature:3, Supporting:2, Developing:1, Dormant:0};

/* Shape classifier (Round 1 §4.1). Uses the TRUE signature count from scores
   (the same isSig rule results() uses), not the display band — which force-names
   a top domain even on a flat profile and would mask a real Plateau. */
function computeShape(R, sorted){
 const scores = sorted.map(d=>R[d.id].score);
 const median = scores.slice().sort((a,b)=>a-b)[4];
 const isSig = v => v>=70 && v>=median+10;
 const sig = scores.filter(isSig).length;
 const sup = sorted.filter(d=> R[d.id].score>=55 && !isSig(R[d.id].score)).length;
 const gap = R[sorted[0].id].score - R[sorted[1].id].score;
 if(sig===1 && gap>=15) return "Tower";
 if(sig>=2) return "Ridge";
 if(sig===1 && sup>=2) return "Anchored";
 return "Plateau";
}

/* Shape metadata + the vertical nine-bar profile diagram (R2 §3.2). */
const SHAPE_META = {
 Tower:   {bars:[10,3,2,3,2,2,3,2,2], line:"one tall bar, the rest low",        move:"give this one peak a partner"},
 Ridge:   {bars:[9,9,3,3,2,3,2,3,2],  line:"two tall bars together",            move:"decide which strand leads"},
 Anchored:{bars:[10,6,6,6,3,3,2,2,3], line:"one tall bar, several mid-height",   move:"choose one strand and braid it on purpose"},
 Plateau: {bars:[6,5,6,5,6,5,6,5,5],  line:"an even, flat cluster",             move:"develop broadly before you specialise"}
};
function buildShapeDiagram(current){
 return `<div class="shapediag">`+["Tower","Ridge","Anchored","Plateau"].map(name=>{
  const on=name===current;
  const bars=SHAPE_META[name].bars.map(v=>`<span class="sbar" style="height:${v*10}%"></span>`).join("");
  return `<figure class="shapemini ${on?'on':''}"><div class="sbars">${bars}</div><figcaption class="sname">${name}${on?" · you":""}</figcaption></figure>`;
 }).join("")+`</div>`;
}
/* Portrait opener + gap headline + one synthesis line (Round 1 §6.1 / §7.2). */
function portraitHTML(m){
 const s0=m.sorted[0].name;
 const supp=DOMAINS.filter(d=>m.band(d)==="Supporting").slice(0,2).map(d=>d.name);
 let opener;
 if(m.shape==="Tower") opener=`You are a <strong>${s0}</strong> genius in the fullest sense — a single, clear peak that runs well ahead of everything else in your profile. The task ahead is not to broaden immediately, but to give this peak a partner.`;
 else if(m.shape==="Ridge") opener=`You are a <strong>${m.braidDoms[0].name}</strong> genius and a <strong>${m.braidDoms[1].name}</strong> genius at once — two gifts standing at nearly the same height. Most people have to build a braid; yours is already standing. The only real decision is which strand leads.`;
 else if(m.shape==="Anchored") opener=`You are a <strong>${s0}</strong> genius anchored by real support — one clear peak, buttressed by strength in ${supp.join(" and ")||"your supporting domains"}. The task ahead is not to build more support; it's to choose one strand and braid it on purpose.`;
 else opener=`Your profile reads even rather than peaked — no domain yet stands clearly above the rest. That isn't an absence of genius; it usually means your Signature lives somewhere this instrument under-measures, or it's real but still latent. The task ahead is developmental before it's strategic.`;
 const headline = m.topUnclaimed ? ` And your record already outruns your self-image in <strong>${m.topUnclaimed.name}</strong> — you undersell it by ${m.gapOf(m.topUnclaimed)} points, the clearest unclaimed gift on this page.` : "";

 return `<p class="portrait">${opener}${headline}${synth}</p>`;
}

/* The interpretation-first block that meets the reader before the taxonomy. */
function interpTop(m){
 return `

/* Reachable next braids (Round 1 §4.3): canonical pairs where one member is
   Signature and the other is Supporting+, ranked by summed score; fall back to
   Strong Pairs to fill two slots. Excludes the reader's primary braid. */
function computeReachable(R, band, primaryKey){
 const eligible = list => list
  .filter(b=>{ const bx=band(domById(b.pair[0])), by=band(domById(b.pair[1]));
    return (bx==="Signature" && BAND_RANK[by]>=2) || (by==="Signature" && BAND_RANK[bx]>=2); })
  .sort((a,b)=> (R[b.pair[0]].score+R[b.pair[1]].score) - (R[a.pair[0]].score+R[a.pair[1]].score));
 const notPrimary = b => braidKey(b.pair[0],b.pair[1])!==primaryKey;
 let picks = eligible(BRAIDS.filter(b=>b.tier==="C" && notPrimary(b))).slice(0,2);
 if(picks.length<2){
  const more = eligible(BRAIDS.filter(b=>b.tier==="S" && notPrimary(b) && !picks.includes(b)));
  picks = picks.concat(more).slice(0,2);
 }
 return picks;
}

/* Read Next ordering (Round 1 §4.4) — labels only, capped at 5. */
function computeReadNext(R, band, sorted, topUnclaimed){
 const out=[], seen=new Set();
 const add=(id,note)=>{ if(id && !seen.has(id)){ seen.add(id); out.push({id, ch:chapterOf(id), name:domById(id).name, note}); } };
 sorted.filter(d=>band(d)==="Signature").forEach(d=>add(d.id,"your Signature"));
 if(topUnclaimed) add(topUnclaimed.id,"the unclaimed pivot");
 const dormantAspir = DOMAINS.find(d=>band(d)==="Dormant" && !R[d.id].skipped && (R[d.id].B-R[d.id].A)<=-30);
 if(dormantAspir) add(dormantAspir.id,"the caution chapter");
 out.push({id:"_stack", ch:`17–18`, name:"Stacking & the protocol", note:"how to braid on purpose"});
 return out.slice(0,5);
}

/* Shared compute layer: derives the full interpretation context (m) from a
   domain-score map R alone. Used by both a live completion (results()) and the
   archived "view" replay (renderArchived()), so a stored submission's original
   scores always run through the exact same braid/shape/gap logic as a live one. */
function computeM(R){
 const sorted=[...DOMAINS].sort((x,y)=>R[y.id].score-R[x.id].score);
 const scores=sorted.map(d=>R[d.id].score);
 const median=scores.slice().sort((a,b)=>a-b)[4];
 const isSig=d=> R[d.id].score>=70 && R[d.id].score>=median+10;
 let sig=sorted.filter(isSig).slice(0,2);
 if(sig.length===0) sig.push(sorted[0]);
 const braidDoms = sig.length>=2 ? [sig[0],sig[1]] : [sorted[0], sorted[1]];
 const primary = braidFor(braidDoms[0].id, braidDoms[1].id);
 const primaryKey = braidKey(braidDoms[0].id, braidDoms[1].id);
 const top3=sorted.slice(0,3);
 const adjKeys=new Set();
 for(let i=0;i<top3.length;i++) for(let j=i+1;j<top3.length;j++){ const k=braidKey(top3[i].id,top3[j].id); if(k!==primaryKey) adjKeys.add(k); }
 const band=d=>{ if(sig.includes(d)) return "Signature";
  if(R[d.id].score>=55) return "Supporting"; if(R[d.id].score<40) return "Dormant"; return "Developing"; };
 const gapOf = d => R[d.id].skipped ? null : Math.round(R[d.id].B - R[d.id].A);
 const unclaimed = DOMAINS.filter(d=> gapOf(d)!=null && gapOf(d)>=30).sort((a,b)=>gapOf(b)-gapOf(a));
 const aspir = DOMAINS.filter(d=> gapOf(d)!=null && gapOf(d)<=-30).sort((a,b)=>gapOf(a)-gapOf(b));
 const topUnclaimed = unclaimed[0] || null;
 const shape = computeShape(R, sorted);
 const reachable = computeReachable(R, band, primaryKey);
 const readNext = computeReadNext(R, band, sorted, topUnclaimed);
 const topDoms = sorted.slice(0,2);
 return {sig, topDoms, sorted, band, R, primary, primaryKey, adjKeys, braidDoms, reachable, readNext, shape, topUnclaimed, aspir, unclaimed, gapOf};
}

/* Hero motif: the book's 3×3 cover grid (nine domains by realm row), with the
   reader's two braid domains lit in gold and a gold thread linking them. */
function buildHeroGlyph(braidDoms){
 const lit = braidDoms.map(d=>d.id);
 const cells = [...DOMAINS].sort((a,b)=>a.cell-b.cell); // 0..8 => 3×3, rows = SOMA/MIND/FIELD
 const cellSvg = cells.map((d,i)=>{
  const col=realmHex(d.meta), x=(i%3), y=Math.floor(i/3);
  const cx=30+x*62, cy=30+y*62, on=lit.includes(d.id);
  const box = on
   ? `<rect x="${cx-26}" y="${cy-26}" width="52" height="52" rx="9" fill="#C39A5B" stroke="#9A7440" stroke-width="1.5"/>`
   : `<rect x="${cx-26}" y="${cy-26}" width="52" height="52" rx="9" fill="${col}" fill-opacity="0.05" stroke="${col}" stroke-opacity="0.28" stroke-width="1.3"/>`;
  const txt = `<text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="15" fill="${on?'#2A2118':col}" fill-opacity="${on?1:0.72}">${d.code}</text>`;
  return box+txt;
 }).join("");
 // gold thread between the two lit cells
 const p=braidDoms.map(d=>{ const i=cells.findIndex(c=>c.id===d.id); return [30+(i%3)*62, 30+Math.floor(i/3)*62]; });
 const thread = p.length===2 ? `<line x1="${p[0][0]}" y1="${p[0][1]}" x2="${p[1][0]}" y2="${p[1][1]}" stroke="#B4832E" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" class="braid-draw" pathLength="1"/>` : "";
 return `<div class="heroglyph"><svg viewBox="0 0 184 184" aria-hidden="true">${thread}${cellSvg}</svg></div>`;
}

/* ============ RESULTS ============ */
function results(){
 setProg(1); litCells(9); busy=false;
 const R={};
 DOMAINS.forEach(d=>{
  const a=S.respA[d.id].map((v,i)=> i===3 ? 4-v : v).reduce((x,y)=>x+y,0); // reverse-key item 4
  const c=S.respC[d.id].reduce((x,y)=>x+y,0);
  const A100=a/20*100, C100=c/12*100;
  const skipped = S.B[d.id]==null; // station skipped -> self-report only
  const B100=(S.B[d.id]??0)*100;
  const score = skipped ? Math.round((0.5*A100+0.2*C100)/0.7) : Math.round(0.5*A100+0.3*B100+0.2*C100);
  R[d.id]={A:A100,B:B100,C:C100,score,skipped};
 });
 const m = computeM(R);
 const sdrFlag = S.respSDR[0]>=3 && S.respSDR[1]>=3;
 const compTop3=m.sorted.slice(0,3).map(d=>d.id);
 const overlap=S.ranksTop.filter(x=>compTop3.includes(x)).length;
 const code = m.sig.map(d=>d.code).join("·") + (m.unclaimed.length?` (+${m.unclaimed.map(d=>d.code.toLowerCase()).join(",")})`:"");
 m.sdrFlag=sdrFlag; m.overlap=overlap;

 const exportObj={v:"GI-1.0",event:"complete",code:S.code||null,consent:S.consent,ts:new Date().toISOString(),
  minutes:Math.round((Date.now()-S.started)/60000),
  A:S.respA,C:S.respC,SDR:S.respSDR,B:S.Braw,Bnorm:S.B,
  ranksTop:S.ranksTop,ranksBot:S.ranksBot,
  domains:Object.fromEntries(DOMAINS.map(d=>[d.id,R[d.id]])),
  signature:code, braid:m.primary?m.primary.name:null, braidPair:m.braidDoms.map(d=>d.id), braidTier:m.primary?m.primary.tier:null,
  adjacent:[...m.adjKeys], shape:m.shape, reachable:m.reachable.map(b=>b.name),

 renderResultsPage(m, exportObj, {archived:false});

/* Archived-result replay: rebuilds a stored submission's domain scores and runs
   them through the exact same computeM()/renderResultsPage() path as a live
   completion, so a Sheet row always opens to the current scoring model's read
   of that submission -- not a frozen snapshot of whatever the code did at the
   time it was collected. Triggered by #view=<encodeURIComponent(raw_json)>. */
let ARCHIVED_PAYLOAD = null;
function domainsFromPayload(payload){
 const R={};
 DOMAINS.forEach(d=>{
  const dd = payload.domains && payload.domains[d.id];
  R[d.id] = dd ? {A:+dd.A||0, B:+dd.B||0, C:+dd.C||0, score:Math.round(dd.score||0), skipped:!!dd.skipped} : {A:0,B:0,C:0,score:0,skipped:true};
 });
 return R;
}
function renderArchived(payload){
 ARCHIVED_PAYLOAD = payload;
 const R = domainsFromPayload(payload);
 const m = computeM(R);
 const sdrFlag = !!(payload.flags && payload.flags.sdr);
 const ranksTop = payload.ranksTop||[];
 const compTop3 = m.sorted.slice(0,3).map(d=>d.id);
 const overlap = ranksTop.filter(x=>compTop3.includes(x)).length;
 m.sdrFlag=sdrFlag; m.overlap=overlap;
 const code = m.sig.map(d=>d.code).join("·") + (m.unclaimed.length?` (+${m.unclaimed.map(d=>d.code.toLowerCase()).join(",")})`:"");
 const exportObj = {
  v:payload.v||"", event:"complete", code:payload.code||null, consent:payload.consent!==false,
  ts:payload.ts||"", minutes:payload.minutes||0,
  domains:payload.domains||Object.fromEntries(DOMAINS.map(d=>[d.id,R[d.id]])),
  signature:code, braid:m.primary?m.primary.name:null, braidPair:m.braidDoms.map(d=>d.id), braidTier:m.primary?m.primary.tier:null,
  adjacent:[...m.adjKeys], shape:m.shape, reachable:m.reachable.map(b=>b.name),
  flags:{sdr:sdrFlag, unclaimed:m.unclaimed.map(d=>d.id), aspirational:m.aspir.map(d=>d.id), topUnclaimed:m.topUnclaimed?m.topUnclaimed.id:null, rankOverlap:overlap}
 };
 renderResultsPage(m, exportObj, {archived:true});
}
function archivedBannerHTML(exportObj){
 const backLink = VIEWING_FROM_PROFILE ? ` <button class="authlink" style="margin-left:4px" onclick="showProfile()">← Back to my results</button>` : "";
 return `<div class="archivedbanner">Archived result${exportObj.code?` · code <strong>${esc(exportObj.code)}</strong>`:""}${exportObj.ts?` · submitted ${new Date(exportObj.ts).toLocaleString()}`:""} — recomputed from the stored answers using the <strong>current</strong> scoring model.${backLink}</div>`;
}

/* ============ SHARE CARD (R6) ============ */
/* Self-contained 1080×1080 SVG -> canvas -> PNG download. No external libs. */
function buildShareCardSVG(m){
 const W=1080,H=1080, primary=domById(m.braidDoms[0].id), other=domById(m.braidDoms[1].id);
 const braidName = m.primary?m.primary.name:"Your Braid";
 const fs = braidName.length>16?66:braidName.length>11?78:92;
 const top3 = m.sorted.slice(0,3);
 const barY0=660, barH=30, barGap=62;
 const bars = top3.map((d,i)=>{ const y=barY0+i*barGap, w=520*d_score(m,d)/100, col=realmHex(d.meta);
   return `<rect x="330" y="${y}" width="520" height="${barH}" rx="7" fill="#00000012"/>
           <rect x="330" y="${y}" width="${w.toFixed(1)}" height="${barH}" rx="7" fill="${col}"/>
           <text x="310" y="${y+barH-8}" text-anchor="end" font-family="Archivo,sans-serif" font-size="22" font-weight="700" fill="#2A2118">${d.name}</text>
           <text x="${330+520+16}" y="${y+barH-8}" text-anchor="start" font-family="Archivo,sans-serif" font-size="22" font-weight="700" fill="${col}">${Math.round(d_score(m,d))}</text>`;
 }).join("");
 const chip=(d,x)=>`<g transform="translate(${x} 470)"><rect x="-118" y="-30" width="236" height="60" rx="30" fill="#FFFFFF55" stroke="${realmHex(d.meta)}" stroke-width="2"/><circle cx="-96" cy="0" r="8" fill="${realmHex(d.meta)}"/><text x="-76" y="8" font-family="Fraunces,serif" font-weight="600" font-size="26" fill="${realmHex(d.meta)}">${d.name}</text></g>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <rect width="${W}" height="${H}" fill="#EDE4D4"/>
  <rect width="${W}" height="14" fill="#C39A5B"/>
  <text x="${W/2}" y="150" text-anchor="middle" font-family="Archivo,sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#7A5B31">THE GENIUS INDEX</text>
  <text x="${W/2}" y="215" text-anchor="middle" font-family="Archivo,sans-serif" font-size="20" letter-spacing="3" fill="#7A5B31">YOUR BRAID</text>
  <text x="${W/2}" y="${215+fs}" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="${fs}" fill="#2A2118">${esc(braidName)}</text>
  ${chip(primary,W/2-135)}${chip(other,W/2+135)}
  <text x="${W/2}" y="590" text-anchor="middle" font-family="Archivo,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#6B6258">SHAPE · ${m.shape.toUpperCase()}</text>
  ${bars}
  <text x="${W/2}" y="960" text-anchor="middle" font-family="Literata,Georgia,serif" font-style="italic" font-size="26" fill="#6B6258">Everybody carries a genius. Find yours — free.</text>
  <rect y="${H-14}" width="${W}" height="14" fill="#C39A5B"/>
 </svg>`;
}
function d_score(m,d){ return m.R[d.id].score; }
function downloadShareCard(m){
 const svgStr = buildShareCardSVG(m);
 const svgBlob = new Blob([svgStr], {type:"image/svg+xml;charset=utf-8"});
 const url = URL.createObjectURL(svgBlob);
 const img = new Image();
 img.onload = ()=>{
  const canvas=document.createElement("canvas"); canvas.width=1080; canvas.height=1080;
  const ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0,1080,1080);
  URL.revokeObjectURL(url);
  canvas.toBlob(blob=>{
   const dl=document.createElement("a"); dl.href=URL.createObjectURL(blob);
   dl.download=`genius-index-${(m.primary?m.primary.name:"result").replace(/\s+/g,"-").toLowerCase()}.png`;
   document.body.appendChild(dl); dl.click(); dl.remove();
  }, "image/png");
 };
 img.onerror = ()=>{ const st=$("shareStatus"); if(st) st.textContent="Couldn't generate the image in this browser — try Save/Print instead."; };
 img.src = url;
}

const BASELINE_KEY = "gi_baseline_v1";

function saveBaseline(exportObj){
 try{ localStorage.setItem(BASELINE_KEY, JSON.stringify({ts:Date.now(), braid:exportObj.braid, shape:exportObj.shape, domains:exportObj.domains})); return true; }

function baselineHTML(exportObj){

 if(!b){ return `<div class="callout callout--slate"><span class="ct">Baseline</span>No saved baseline yet on this device. Save this result to compare against a future retake.
   <div class="btnrow" style="margin-top:10px"><button class="btn book-ghost" id="saveBaselineBtn" style="max-width:260px">Save this as my baseline</button></div></div>`; }
 const days = Math.max(0, Math.round((Date.now()-b.ts)/86400000));
 const deltas = DOMAINS.map(d=>({d, delta: Math.round((exportObj.domains[d.id]?.score||0) - (b.domains[d.id]?.score||0))}))
   .filter(x=>Math.abs(x.delta)>=5).sort((a,c)=>Math.abs(c.delta)-Math.abs(a.delta)).slice(0,4);
 const deltaList = deltas.length ? deltas.map(x=>`${x.d.name} ${x.delta>0?"+":""}${x.delta}`).join(", ") : "no domain moved more than a few points";
 const nudge = days>=90 ? ` It's been ${days} days since your last baseline — right on schedule for a check-in.` : ` Next check-in around day 90 (in ${90-days} days).`;
 return `<div class="callout callout--slate"><span class="ct">Since your last baseline · ${days} day${days===1?"":"s"} ago</span>
   Braid then: <strong>${b.braid||"—"}</strong> (${b.shape||"—"}). Braid now: <strong>${exportObj.braid||"—"}</strong> (${exportObj.shape}). Biggest moves: ${deltaList}.${nudge}
   <div class="btnrow" style="margin-top:10px"><button class="btn book-ghost" id="saveBaselineBtn" style="max-width:260px">Update my baseline to today</button></div></div>`;
}

/* Constellation hover/focus tooltip: name, score, one-line definition. */
function wireWheelTooltip(){
 const wrap=$("wheelWrap"), tip=$("wheelTip");
 if(!wrap||!tip) return;
 const show=node=>{ const wr=wrap.getBoundingClientRect(), nr=node.getBoundingClientRect();
  tip.innerHTML=`<strong>${node.dataset.name}</strong> — ${node.dataset.body}`;
  tip.style.left=(nr.left+nr.width/2-wr.left)+"px";
  tip.style.top=(nr.top-wr.top)+"px";
  tip.hidden=false; };
 const hide=()=>{ tip.hidden=true; };
 wrap.querySelectorAll(".wnode").forEach(node=>{
  node.addEventListener("pointerenter",()=>show(node));
  node.addEventListener("pointerleave",hide);
  node.addEventListener("focus",()=>show(node));
  node.addEventListener("blur",hide);
 });
}

 return `

function showChapter(entryId){
 const c=S.ctx; if(!c || !c.m) return;
 try{ history.pushState(null,"","#chapter-"+entryId); }catch(e){}
 const title=chapterTitle(entryId);
 const body = entryId==="_stack" ? buildStackChapter(c) : buildDomainChapter(entryId, c);
 h(`<div class="stagecount" style="margin-top:8px">Chapter ${title.ch} · ${title.name}</div>${body}`);
}

/* ============ BOOT ============ */
let busy=false;
window.addEventListener("beforeunload",e=>{ if(busy){ e.preventDefault(); e.returnValue=""; } });
// Inventory keyboard nav: ←/→ = Back/Next. Only when the nav buttons are on screen
// and focus isn't in a text field. Acts through the buttons so disabled-state is honored.
document.addEventListener("keydown",e=>{
 if(/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||"")) return;
 const back=$("navBack"), next=$("navNext");
 if(!back && !next) return;
 if(e.key==="ArrowLeft" && back && !back.disabled){ e.preventDefault(); goBack(); }
 else if(e.key==="ArrowRight" && next && !next.disabled){ e.preventDefault(); goNext(); }
});
// Force the Evidence Ledger / A·B·C explainer open for print — CSS alone can't override
// Chromium's internal collapsed-<details> rendering, so toggle the real `open` state.
window.addEventListener("beforeprint",()=>{
 document.querySelectorAll("details.ev, details.abc").forEach(d=>{ d.dataset.wasOpen = d.open?"1":"0"; d.open = true; });
});
window.addEventListener("afterprint",()=>{
 document.querySelectorAll("details.ev, details.abc").forEach(d=>{ d.open = d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; });
});
function bootFromHash(){
 const hs=location.hash;
 if(hs.indexOf("#view=")===0){
  try{
   const payload=JSON.parse(decodeURIComponent(hs.slice(6)));
   VIEWING_FROM_PROFILE=false; // a shared Sheet link, not a profile-history visit
   renderArchived(payload);
  }catch(e){
   h(`<div class="card"><h3>Couldn't open this archived result</h3><p class="small">The link may be corrupted or truncated. <a href="./">Take the assessment →</a></p></div>`);
  }
  return true;
 }
 return false;
}
loadFirebaseSDK(); // no-op, no network request, unless FIREBASE_CONFIG is set
if(!bootFromHash()) intro();
