<style>
  :root{
    /* — Material world (shared with the book + print system) — */
    --ink:#231B15; --ink2:#2E241B; --paper:#EDE4D4; --paper-dim:#B9AD98;
    --brass:#C39A5B; --brass-deep:#9A7440; --brass-light:#D3AC6C; /* the Glow */
    --oxblood:#8C3B2E; --moss:#5E7367; --slate:#7E93A8; --sage:#A9B4A6;

    --gold-ink:#7A5B31; --gold-chord:#6E6150;
    --book-paper:#EDE4D4; --book-ink:#2A2118; --book-dim:#6B6258; --book-line:rgba(42,33,24,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  body{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:660px; padding:20px 18px 64px;}
  header{display:flex; justify-content:space-between; align-items:center; padding:14px 2px 10px; border-bottom:1px solid var(--line); margin-bottom:22px;}

  .sub{font-size:10px; letter-spacing:.14em; color:var(--paper-dim); text-transform:uppercase; margin-top:3px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(30px,7vw,44px); line-height:1.06; letter-spacing:-0.01em;}
  h2{font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.15; margin-bottom:10px;}
  h3{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass); margin-bottom:8px; font-weight:600;}
  p{line-height:1.55; font-size:15px;}
  .dim{color:var(--paper-dim);}
  .small{font-size:12.5px; line-height:1.5;}

  .glyph{display:grid; grid-template-columns:repeat(3,12px); grid-template-rows:repeat(3,12px); gap:3px;}
  .glyph div{background:transparent; border:1px solid var(--brass-deep); transition:background .5s ease;}
  .glyph div.lit{background:var(--brass);}
  .glyph.big{grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:8px; margin:18px auto;}
  .glyph.big div{border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; letter-spacing:.06em; transition:background .5s;}
  .glyph.big .code{font-weight:700; font-size:14px; font-family:'Fraunces',serif;}
  .glyph.big .pct{font-size:10px; color:var(--ink); opacity:.85;}
  /* Buttons */
  .btn{display:block; width:100%; padding:15px 16px; margin:8px 0; background:var(--ink2); border:1px solid var(--line); color:var(--paper); font-family:'Archivo',sans-serif; font-size:15px; text-align:left; cursor:pointer; transition:border-color .15s, background .15s;}
  /* Keyboard focus always highlights; hover only on real pointers so a tapped
     position doesn't stay "stuck" looking selected on the next question (touch fix). */
  .btn:focus-visible{border-color:var(--brass); outline:none;}
  @media (hover:hover){ .btn:hover{border-color:var(--brass); outline:none;} }
  .btn.sel{border-color:var(--brass); background:#3A2E20;}
  .btn.primary{background:var(--brass); color:var(--ink); font-weight:700; text-align:center; border:none; letter-spacing:.04em;}
  @media (hover:hover){ .btn.primary:hover{background:#D3AC6C;} }
  .btn.ghost{text-align:center; color:var(--paper-dim);}
  .btn:disabled{opacity:.35; cursor:default;}
  .btnrow{display:flex; gap:8px;} .btnrow .btn{margin:8px 0;}
  /* Progress */
  .prog{height:3px; background:var(--ink2); margin:0 0 20px; position:relative;}
  .prog i{position:absolute; left:0; top:0; bottom:0; background:var(--brass); transition:width .3s;}
  .stagecount{font-size:11px; letter-spacing:.16em; color:var(--paper-dim); text-transform:uppercase; margin-bottom:14px;}
  /* Cards & misc */
  .card{background:var(--ink2); border:1px solid var(--line); padding:18px; margin:14px 0;}
  .rule{border:none; border-top:1px solid var(--line); margin:18px 0;}

  /* ── Callout card: the single reusable module component (colored left border).
     Set --accent + --accent-tint; every new results module is built on this. ── */
  .callout{--accent:var(--brass); --accent-tint:rgba(195,154,91,.12);
    border-left:3px solid var(--accent); padding:12px 14px; margin:12px 0;
    background:var(--accent-tint); font-size:13.5px; line-height:1.5; border-radius:0 4px 4px 0;}
  .callout .ct{display:block; font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--accent); margin-bottom:3px; letter-spacing:.01em;}
  .callout--oxblood{--accent:var(--oxblood); --accent-tint:rgba(140,59,46,.12);}
  .callout--moss{--accent:var(--moss); --accent-tint:rgba(94,115,103,.12);}
  .callout--slate{--accent:var(--slate); --accent-tint:rgba(126,147,168,.14);}
  .callout--brass{--accent:var(--brass-deep); --accent-tint:rgba(195,154,91,.14);}

  .pass{border-left:3px solid var(--moss); padding:10px 12px; background:rgba(94,115,103,.12); margin:10px 0; font-size:13.5px; line-height:1.5; border-radius:0 4px 4px 0;}
  .timer{font-family:'Fraunces',serif; font-size:40px; font-weight:700; text-align:center; margin:10px 0; font-variant-numeric:tabular-nums;}

  .soma i{background:var(--brass);} .mind i{background:#A9B4A6;} .field i{background:#7E93A8;}
  .sig{font-family:'Fraunces',serif; font-size:clamp(34px,9vw,52px); font-weight:700; text-align:center; color:var(--brass); margin:10px 0 2px; letter-spacing:.02em;}
  .sigsub{text-align:center; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:14px;}

  th{color:var(--brass); font-size:11px; letter-spacing:.12em; text-transform:uppercase;}
  .export{font-size:11px; height:120px; word-break:break-all;}
  /* ============ RESULTS · BOOK PAGES ============ */
  .book{background:var(--book-paper); color:var(--book-ink); margin:22px -18px 0; padding:26px 20px 30px; border-top:2px solid var(--brass);}
  .book + .book{margin-top:0; border-top:1px solid var(--book-line);}
  .book .eyebrow-b{font-family:'Archivo',sans-serif; font-size:10.5px; letter-spacing:.28em; font-weight:700; text-transform:uppercase; color:var(--gold-ink); text-align:center;}
  .book h2.bt{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(24px,6vw,32px); line-height:1.08; text-align:center; color:var(--book-ink); margin:4px 0 6px; letter-spacing:-.01em;}
  .book .btsub{font-family:'Literata',Georgia,serif; font-style:italic; font-size:14px; line-height:1.4; text-align:center; color:var(--book-dim); max-width:44ch; margin:0 auto 4px;}
  .book .brule{width:56px; height:2px; background:var(--brass); border:none; margin:12px auto 20px;}
  .book .bfoot{font-family:'Literata',Georgia,serif; font-style:italic; font-size:12.5px; line-height:1.5; color:var(--book-dim); border-top:1px solid var(--book-line); margin-top:22px; padding-top:14px;}
  /* Braid hero card */
  .braidcard{text-align:center; padding:8px 0 4px;}
  .braidcard .yb{font-family:'Archivo',sans-serif; font-size:11px; letter-spacing:.26em; font-weight:700; text-transform:uppercase; color:var(--gold-ink);}
  .braidcard .bname{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(38px,11vw,60px); line-height:1.02; color:var(--book-ink); margin:6px 0 12px; letter-spacing:.01em;}

  .domchip{display:inline-flex; align-items:center; gap:7px; padding:7px 14px 7px 11px; border-radius:20px; font-family:'Fraunces',serif; font-weight:600; font-size:15px; background:rgba(0,0,0,.03);}
  .domchip .dot{width:11px; height:11px; border-radius:50%;}
  .domchip.soma{color:var(--soma); box-shadow:inset 0 0 0 1.5px rgba(140,59,46,.45);} .domchip.soma .dot{background:var(--soma);}
  .domchip.mind{color:var(--mind); box-shadow:inset 0 0 0 1.5px rgba(84,104,124,.45);} .domchip.mind .dot{background:var(--mind);}

  .tierbadge{display:inline-block; margin:8px auto 2px; padding:6px 16px; border-radius:4px; font-family:'Archivo',sans-serif; font-size:11px; letter-spacing:.18em; font-weight:700; text-transform:uppercase;}

  .tier-S{background:rgba(78,97,86,.16); color:var(--field); box-shadow:inset 0 0 0 1.5px rgba(78,97,86,.5);}
  .tier-R{background:rgba(140,59,46,.13); color:var(--soma); box-shadow:inset 0 0 0 1.5px rgba(140,59,46,.5);}

  .wheelwrap{margin:6px auto 0; max-width:520px;}
  .wheelwrap svg{display:block; width:100%; height:auto; overflow:visible;}
  /* Index grid */
  .gridscroll{overflow-x:auto; margin:6px -20px 0; padding:0 20px 6px;}
  .igrid{border-collapse:separate; border-spacing:3px; margin:0 auto; min-width:min-content;}
  .igrid td{padding:0; border:none;}
  .gcell{width:62px; height:40px; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; line-height:1.05;}

  .fgrow .fgn{font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--book-ink);}
  .fgrow .fgp{font-family:'Archivo',sans-serif; font-size:9.5px; letter-spacing:.04em; color:var(--book-dim); font-weight:600;}
  .fgrow .fgd{font-family:'Literata',Georgia,serif; font-size:11.5px; color:var(--book-dim); line-height:1.35; display:block; width:100%;}
  .fgrow.mine{background:rgba(195,154,91,.22); box-shadow:inset 0 0 0 1.5px var(--brass);}
  .fgrow.adj{background:rgba(195,154,91,.08);}
  .fgtxt{flex:1;}
  /* Result action buttons */
  .book .btn.book-primary{background:var(--brass); color:#2A2118; border:none; font-weight:700; text-align:center; letter-spacing:.03em;}
  .book .btn.book-ghost{background:transparent; color:var(--gold-ink); border:1px solid rgba(122,91,49,.4); text-align:center;}
  .submitstatus{font-family:'Archivo',sans-serif; font-size:12.5px; text-align:center; margin:12px 0 0; color:var(--book-dim);}
  .submitstatus.ok{color:var(--field);} .submitstatus.err{color:var(--soma);}
  .book details{margin-top:16px;} .book details summary{cursor:pointer; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--book-dim); font-weight:600;}
  .book .export{background:#F5EFE2; border:1px solid var(--book-line); color:var(--book-ink);}
  .consentline{display:flex; gap:10px; align-items:flex-start; margin:14px 0 4px; font-size:12.5px; line-height:1.45;}
  .consentline input{width:20px; height:20px; accent-color:var(--brass); flex:0 0 auto; margin-top:1px;}
  /* Print */
  @media print{
    html,body{background:#fff !important; color:#000 !important;}
    header, .prog, .btn, .btnrow, details, .stagecount{display:none !important;}
    .book{background:#fff !important; color:#000 !important; border-color:#999 !important; margin:0 !important; padding:14px 0 !important; break-inside:avoid;}
    .wrap{max-width:100%; padding:0;}
    .submitstatus{display:none !important;}
  }
  /* The one signature motion moment: gold braid thread draws in on the Constellation. */
  @media (prefers-reduced-motion: no-preference){
    .braid-draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:braidDraw 1.15s cubic-bezier(.6,.02,.2,1) .25s forwards; }
    @keyframes braidDraw{ to{ stroke-dashoffset:0; } }
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} .braid-draw{stroke-dasharray:none; stroke-dashoffset:0;} }
</style>

<script>

  </div>
 `);
}
function curAnswer(){ const f=FLOW[S.flowIdx];
 return f.t==="A"?S.respA[f.d][f.i] : f.t==="C"?S.respC[f.d][f.i] : S.respSDR[f.i]; }
function goBack(){ if(S.flowIdx>0){ S.flowIdx--; renderQ(); } }
function goNext(){ if(curAnswer()!=null && S.flowIdx<FLOW.length){ S.flowIdx++; renderQ(); } }
function answer(v){
 const f=FLOW[S.flowIdx];
 if(f.t==="A") S.respA[f.d][f.i]=v;

/* --- SEN: pitch match (Web Audio) --- */
function stSEN(){
 let trial=0, correct=0, ctx=null;
 function tone(f,when,dur){ const o=ctx.createOscillator(), g=ctx.createGain();
  o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.25,when+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur); o.start(when); o.stop(when+dur+0.05); }
 function render(){
  if(trial>=PITCH_TRIALS.length){ completeStation("SEN", correct/5, correct+"/5"); return; }
  h(`
   <div class="stagecount">Station 2 of 9 · Sensory</div>
   <h2>Pitch match · trial ${trial+1} of 5</h2>
   <p class="dim small">Two tones will play. Use earphones or a quiet room. Was the second tone higher, lower, or the same?</p>
   <button class="btn primary" id="playT">Play tones</button>
   <div class="btnrow">
    <button class="btn" id="hi" disabled>Higher</button>
    <button class="btn" id="same" disabled>Same</button>
    <button class="btn" id="lo" disabled>Lower</button>
   </div>
   <p class="small dim" id="senMsg"></p>
   <button class="btn ghost" id="senSkip">No sound on this device — skip station</button>
  `);
  $("senSkip").onclick=()=>skipStation("SEN");
  $("playT").onclick=()=>{
   try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume && ctx.resume();
    const t=PITCH_TRIALS[trial], f2=t.base*Math.pow(2,t.cents/1200), now=ctx.currentTime+0.05;
    tone(t.base,now,0.7); tone(f2,now+1.0,0.7);
    ["hi","same","lo"].forEach(id=>$(id).disabled=false);
   }catch(err){ $("senMsg").textContent="Audio isn't available in this browser — use “skip station” below."; }
  };
  const key = PITCH_TRIALS[trial].cents>0?"hi":PITCH_TRIALS[trial].cents<0?"lo":"same";
  ["hi","same","lo"].forEach(id=>{ $(id).onclick=()=>{ if(id===key) correct++; trial++; render(); }; });
 }
 render();
}

/* ============ RESULTS HELPERS ============ */
const realmColor = meta => meta==="soma"?"var(--soma)" : meta==="mind"?"var(--mind)" : "var(--field)";
const realmHex   = meta => meta==="soma"?"#8C3B2E"     : meta==="mind"?"#54687C"     : "#4E6156";
const domById = id => DOMAINS.find(d=>d.id===id);

/* Personal constellation wheel (SVG). R = scores map, primaryKey + adjKeys highlight braids. */
function buildWheel(R, primaryKey, adjKeys, primaryBraid){
 const cx=312, cy=340, Rr=185;
 const order=["EXP","PER","KIN","SEN","ADP","ANL","MEM","GEN","REL"];
 const ang={}; order.forEach((id,i)=> ang[id]=-90+i*40);
 const pos={}; order.forEach(id=>{ const a=ang[id]*Math.PI/180; pos[id]=[cx+Rr*Math.cos(a), cy+Rr*Math.sin(a)]; });
 const polar=(r,deg)=>{ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
 const arc=(r,a0,a1)=>{ const [x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
 let svg=`<svg viewBox="0 0 624 640" role="img" aria-label="Your genius constellation">`;
 svg+=`<path d="${arc(Rr+40,-30,90)}" fill="none" stroke="#8C3B2E" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 svg+=`<path d="${arc(Rr+40,90,210)}" fill="none" stroke="#54687C" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 svg+=`<path d="${arc(Rr+40,210,330)}" fill="none" stroke="#4E6156" stroke-width="7" stroke-opacity=".75" stroke-linecap="round"/>`;
 const lbl=(txt,deg,col)=>{ const [x,y]=polar(Rr+62,deg); return `<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="${col}">${txt}</text>`; };
 svg+=lbl("SOMA",30,"#8C3B2E")+lbl("MIND",150,"#54687C")+lbl("FIELD",270,"#4E6156");
 const chord=(k,br)=>{ const [a,b]=k.split("|"); const [x0,y0]=pos[a],[x1,y1]=pos[b];
  let stroke="#8C7E69",w=1,op=.22;
  if(br.tier==="C"){ stroke="#6E6150"; w=1.5; op=.42; }
  if(adjKeys.has(k)){ stroke="#9A7440"; w=2.4; op=.72; }
  const isPrimary=(k===primaryKey);
  if(isPrimary){ stroke="#B4832E"; w=4.5; op=.98; }
  // The one orchestrated moment: the primary braid thread draws itself in on load.
  const extra = isPrimary ? ` class="braid-draw" pathLength="1"` : "";
  return {svg:`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${stroke}" stroke-width="${w}" stroke-opacity="${op}" stroke-linecap="round"${extra}/>`, top:(k===primaryKey||adjKeys.has(k))}; };
 const cs=BRAIDS.map(br=>chord(braidKey(br.pair[0],br.pair[1]),br));
 svg+=cs.filter(c=>!c.top).map(c=>c.svg).join("")+cs.filter(c=>c.top).map(c=>c.svg).join("");
 if(primaryBraid){ const [a,b]=primaryKey.split("|"); const mx=(pos[a][0]+pos[b][0])/2, my=(pos[a][1]+pos[b][1])/2;
  const w=primaryBraid.name.length*7.2+16;
  svg+=`<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)})"><rect x="${(-w/2).toFixed(1)}" y="-11" width="${w.toFixed(1)}" height="22" rx="5" fill="#EFE7D6" stroke="#B4832E" stroke-width="1.3"/><text x="0" y="4.5" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="12.5" fill="#7A5B31">${primaryBraid.name}</text></g>`; }
 order.forEach(id=>{ const d=domById(id), [x,y]=pos[id], sc=R[id].score;
  const col=realmHex(d.meta), r=22+sc/100*7, op=(0.12+0.5*sc/100).toFixed(2);
  const isTop=(id===primaryKey.split("|")[0]||id===primaryKey.split("|")[1]);
  svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="${isTop?3:1.5}"/>`;
  svg+=`<text x="${x.toFixed(1)}" y="${(y+1).toFixed(1)}" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="13" fill="${col}">${d.code}</text>`;
  svg+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-size="9" font-weight="700" fill="${col}">${sc}</text>`;
 });
 svg+=`</svg>`;
 return svg;
}

/* Triangular Complete Index Grid, personalized. */
function buildGrid(R, primaryKey, adjKeys){
 let rows="";
 for(let r=0;r<9;r++){
  let cells="";
  for(let c=0;c<=r;c++){
   if(c===r){ const d=DOMAINS[r];
    cells+=`<td><div class="gcell" style="background:${realmColor(d.meta)};color:#EDE4D4"><span class="gn" style="opacity:.85">${d.code}</span><span class="gs">${R[d.id].score}</span></div></td>`;
   } else { const br=braidFor(DOMAINS[r].id,DOMAINS[c].id), k=braidKey(DOMAINS[r].id,DOMAINS[c].id);
    const canon=br.tier==="C"; const mine=k===primaryKey, adj=adjKeys.has(k);
    const bg = mine?"rgba(195,154,91,.35)": canon?"rgba(195,154,91,.16)":"rgba(0,0,0,.03)";
    const dotc = br.tier==="C"?"#B4832E":br.tier==="S"?"#4E6156":br.tier==="R"?"#8C3B2E":"#54687C";
    cells+=`<td><div class="gcell ${mine?'mine':adj?'adj':''}" style="background:${bg}"><span class="gn" style="color:var(--book-ink)">${br.name.replace(/^The /,"")}</span><span class="gt" style="color:${dotc}">●</span></div></td>`;
   }
  }
  rows+=`<tr>${cells}</tr>`;
 }
 return `<div class="gridscroll"><table class="igrid">${rows}</table></div>`;
}

/* Field guide: all 36, grouped by tier, personalized. */
function buildFieldGuide(R, primaryKey, adjKeys){
 const groups=[["C","The Canonical Ten"],["S","The Strong Pairs"],["R","The Rarest"],["Q","The Quiet Few"]];
 let out="";
 groups.forEach(([t,title])=>{
  const items=BRAIDS.filter(b=>b.tier===t);
  out+=`<div class="eyebrow-b" style="text-align:left;margin:14px 0 4px">${title}</div><div class="fgcols">`;
  items.forEach(br=>{ const k=braidKey(br.pair[0],br.pair[1]);
   const mine=k===primaryKey, adj=adjKeys.has(k);
   const ps=(R[br.pair[0]].score+R[br.pair[1]].score)/2;
   const op=mine?1:(0.5+0.5*ps/100).toFixed(2);
   const codes=br.pair.map(id=>domById(id).code).join("·");
   out+=`<div class="fgrow ${t==="C"?'canon':''} ${mine?'mine':adj?'adj':''}" style="opacity:${op}">
     <span class="fgdot"></span><div class="fgtxt"><span class="fgn">${br.name}</span> <span class="fgp">${codes}</span><span class="fgd">${br.desc}${br.rare?" · also among the rarest":""}</span></div></div>`;
  });
  out+=`</div>`;
 });
 return out;
}

function results(){

 const R={};
 DOMAINS.forEach(d=>{

  const skipped = S.B[d.id]==null; // station skipped -> self-report only
  const B100=(S.B[d.id]??0)*100;
  const score = skipped ? Math.round((0.5*A100+0.2*C100)/0.7) : Math.round(0.5*A100+0.3*B100+0.2*C100);
  R[d.id]={A:A100,B:B100,C:C100,score,skipped};
 });
 const sorted=[...DOMAINS].sort((x,y)=>R[y.id].score-R[x.id].score);
 const scores=sorted.map(d=>R[d.id].score);

 const isSig=d=> R[d.id].score>=70 && R[d.id].score>=median+10;

window.addEventListener("beforeunload",e=>{ if(busy){ e.preventDefault(); e.returnValue=""; } });
// Inventory keyboard nav: ←/→ = Back/Next. Only when the nav buttons are on screen
// and focus isn't in a text field. Acts through the buttons so disabled-state is honored.
document.addEventListener("keydown",e=>{
 if(/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||"")) return;
 const back=$("navBack"), next=$("navNext");
 if(!back && !next) return;
 if(e.key==="ArrowLeft" && back && !back.disabled){ e.preventDefault(); goBack(); }
 else if(e.key==="ArrowRight" && next && !next.disabled){ e.preventDefault(); goNext(); }
});
intro();
</script>
